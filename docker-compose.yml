services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - log-net

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "514:1514/udp"
      # เปิดบรรทัดนี้เฉพาะเมื่อจะใช้ Syslog แบบ TCP
      # - "514:1514/tcp"
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    networks:
      - log-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: "grafana_secure_password"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - log-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "เปลี่ยนรหัสผ่านให้ยาวและเดายาก"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      # ตั้งค่าเชื่อมต่อ PostgreSQL สำหรับ Grafana
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: "grafana_secure_password"
      GF_DATABASE_SSL_MODE: disable
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3301:3000"
    depends_on:
      - loki
      - postgres
    networks:
      - log-net

volumes:
  loki-data:
  alloy-data:
  grafana-data:
  postgres-data:

networks:
  log-net:
    driver: bridge
